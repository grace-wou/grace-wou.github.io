<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes | Grace Wou</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="page-section">
  <a href="index.html" class="back-link">
    <span class="back-arrow">←</span>
    <span class="back-name">Grace Wou</span>
  </a>
  
<div class="fade-content">

  <section class="page-section">
    <h2 class="page-title">Things I find interesting</h2>

    <div class="note-entry">
      <h4>Note Title</h4>
      <p class="note-date">Sep 2026</p>
      <p>Write your note here.</p>
    </div>
  </section>

  <footer>
    <div class="social-links">
      <a href="mailto:gwou@umich.edu" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
      <a href="https://www.linkedin.com/in/gwou/" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
    </div>
    <p>© 2026 Grace Wou</p>
  </footer>

</div>

<script>
  document.querySelectorAll('nav a, .project-row').forEach(link => {
    link.addEventListener('click', function (e) {
      const href = this.getAttribute('href');
      if (href && !href.startsWith('http') && !href.startsWith('mailto') && !href.endsWith('.pdf') && this.target !== '_blank') {
        e.preventDefault();
        document.querySelector('.fade-content').classList.add('fade-out');
        setTimeout(() => { window.location.href = href; }, 600);
      }
    });
  });
</script>

</body>
</html>
