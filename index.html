<script>
  // Draw the handwritten signature after the typewriter finishes
  window.addEventListener('load', () => {
    const paths = document.querySelectorAll('#signature path');
    paths.forEach((path, i) => {
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.style.animation = `draw 1.2s ease forwards`;
      path.style.animationDelay = (1.5 + i * 0.3) + 's';
    });
  });

  // Page transitions (nav excluded from fade)
  document.querySelectorAll('nav a, .project-row').forEach(link => {
    link.addEventListener('click', function (e) {
      const href = this.getAttribute('href');
      const isSameSite = href && !href.startsWith('http') && !href.startsWith('mailto') && !href.endsWith('.pdf') && this.target !== '_blank';
      if (!isSameSite) return;

      const fadeEl = document.querySelector('.fade-content');
      if (!fadeEl) { window.location.href = href; return; }

      e.preventDefault();
      fadeEl.classList.add('fade-out');
      setTimeout(() => { window.location.href = href; }, 600);
    });
  });
</script>
