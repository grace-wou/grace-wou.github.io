<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html">about</a>
  <a href="projects.html">projects</a>
  <a href="files/Grace_Wou_Resume.pdf" target="_blank">resume</a>
  <a href="notes.html">notes</a>
</nav>

<div class="fade-content">

  <section class="page-section">

    <h1 class="typewriter" id="typewriter">Hello! I'm</h1>

    <div class="hero-name" id="signature">
      <!-- your handwriting SVG code goes here -->
    </div>

    <p class="hero-subtitle">
      I'm a Mechanical Engineering student @ the University of Michigan<br>
      with a passion for robotics &amp; hands-on design.<br>
      I'm driven by curiosity: building things, taking them apart,<br>
      and discovering how the world works.
    </p>

  </section>

  <footer>
    <div class="social-links">
      <a href="mailto:gwou@umich.edu" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
      <a href="https://www.linkedin.com/in/gwou/" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
    </div>
    <p>© 2026 Grace Wou</p>
  </footer>

</div>

<script>
  // Draw the handwritten signature after the typewriter finishes
  window.addEventListener('load', () => {
    const paths = document.querySelectorAll('#signature path');
    paths.forEach((path, i) => {
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.style.animation = `draw 1.2s ease forwards`;
      path.style.animationDelay = (1.5 + i * 0.35) + 's';
    });
  });

  // Page transitions (nav excluded from fade)
  document.querySelectorAll('nav a, .project-row').forEach(link => {
    link.addEventListener('click', function (e) {
      const href = this.getAttribute('href');
      if (href && !href.startsWith('http') && !href.startsWith('mailto') && !href.endsWith('.pdf') && this.target !== '_blank') {
        e.preventDefault();
        document.querySelector('.fade-content').classList.add('fade-out');
        setTimeout(() => { window.location.href = href; }, 600);
      }
    });
  });
</script>

</body>
</html>
