<script>
  // Draw the handwritten signature, left to right, after the typewriter finishes
  window.addEventListener('load', () => {
    const svgEl = document.querySelector('#signature svg');
    const allPaths = Array.from(svgEl.querySelectorAll('path'));
    const underline = svgEl.querySelector('#svg_46');
    const letterPaths = allPaths.filter(p => p.id !== 'svg_46');

    letterPaths.sort((a, b) => a.getBBox().x - b.getBBox().x);

    let delay = 1.5;
    letterPaths.forEach(path => {
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.style.animation = `draw 0.5s ease forwards`;
      path.style.animationDelay = `${delay}s`;
      delay += 0.25;
    });

    if (underline) {
      const length = underline.getTotalLength();
      underline.style.strokeDasharray = length;
      underline.style.strokeDashoffset = length;
      underline.style.animation = `draw 0.8s ease forwards`;
      underline.style.animationDelay = `${delay + 0.2}s`;
    }
  });

  // Page transitions (nav excluded from fade)
  document.querySelectorAll('nav a, .project-row').forEach(link => {
    link.addEventListener('click', function (e) {
      const href = this.getAttribute('href');
      const isSameSite = href && !href.startsWith('http') && !href.startsWith('mailto') && !href.endsWith('.pdf') && this.target !== '_blank';
      if (!isSameSite) return;

      const fadeEl = document.querySelector('.fade-content');
      if (!fadeEl) { window.location.href = href; return; }

      e.preventDefault();
      fadeEl.classList.add('fade-out');
      setTimeout(() => { window.location.href = href; }, 600);
    });
  });
</script>
